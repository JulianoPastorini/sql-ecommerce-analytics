<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Bugiganga Shop</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/datalayer.js"></script>
    <script src="js/controllers/globalNavigationController.js"></script>
    <script
      src="https://assets.adobedtm.com/25faba9991ad/f3daccd6a526/launch-7e881a629ad6-development.min.js"
      async
    ></script>
  </head>
  <body data-page-name="ecommerce:auth:login" data-page-type="login">
    <header class="store-header">
      <a class="store-logo" href="home.html" data-analytics-click="logo-home"
        >Bugiganga Shop</a
      >
      <div class="user-summary">
        <strong>Perfil</strong><span>Acesse sua conta</span
        ><small data-menu-user-id></small>
      </div>
      <nav class="store-nav" aria-label="Navegação principal">
        <a href="home.html" data-analytics-click="produtos-recomendados"
          >Produtos Recomendados</a
        >
        <a href="catalogo.html" data-analytics-click="todos-itens"
          >Todos os itens</a
        >
        <a href="carrinho.html" data-analytics-click="carrinho">Carrinho</a>
        <a href="login.html" data-analytics-click="perfil">Perfil</a>
      </nav>
    </header>
    <main>
      <div
        class="detalhe-produto"
        style="max-width: 400px; margin: 40px auto; text-align: left"
      >
        <h2>Identificação do Cliente</h2>
        <p>
          Faça login para simular a captura do seu Customer ID no Adobe
          Analytics.
        </p>
        <form
          id="form-login"
          style="
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
          "
        >
          <label for="nome-usuario">Nome:</label>
          <input
            type="text"
            id="nome-usuario"
            placeholder="ex: Juliano"
            required
            style="
              padding: 10px;
              font-size: 16px;
              border: 1px solid #ccc;
              border-radius: 4px;
            "
          />
          <label for="email-usuario">E-mail de acesso:</label>
          <input
            type="email"
            id="email-usuario"
            placeholder="ex: juliano@email.com"
            required
            style="
              padding: 10px;
              font-size: 16px;
              border: 1px solid #ccc;
              border-radius: 4px;
            "
          /><button
            type="submit"
            class="btn"
            data-analytics-click="login-submit"
            style="cursor: pointer"
          >
            Entrar no Sistema
          </button>
        </form>
        <button
          id="skip-login"
          type="button"
          class="skip-login-button"
          data-analytics-click="login-anonimo"
        >
          Continuar sem login
        </button>
      </div>
    </main>
    <script src="js/services/cartService.js"></script>
    <script src="js/controllers/appController.js"></script>
  </body>
</html>
